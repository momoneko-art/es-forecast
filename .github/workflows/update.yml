name: Update Es forecast data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: es-forecast-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and rebuild index
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "es-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json debug.json history.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Es forecast data [skip ci]"
            git push
          fi
